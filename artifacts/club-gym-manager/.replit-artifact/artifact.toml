kind = "web"
previewPath = "/"
title = "Club Gym Manager"
description = "A full-stack gym operations app for club administrators and staff to manage members, memberships, attendance, sessions, training plans, approvals, and payments using a shared API and persistent database."
version = "1.0.0"
id = "artifacts/club-gym-manager"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20894

[services.development]
run = "pnpm --filter @workspace/club-gym-manager run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/club-gym-manager", "run", "build" ]
serve = "static"
publicDir = "artifacts/club-gym-manager/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20894"
BASE_PATH = "/"
